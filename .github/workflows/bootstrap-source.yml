name: Bootstrap Takto source

on:
  push:
    branches:
      - feat/0.1.0-initial-app
    paths:
      - bootstrap/**
      - .github/workflows/bootstrap-source.yml

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/0.1.0-initial-app
          fetch-depth: 0

      - name: Restore remaining source files
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part* > /tmp/takto-source.tar.gz.b64
          base64 --decode /tmp/takto-source.tar.gz.b64 > /tmp/takto-source.tar.gz
          tar -xzf /tmp/takto-source.tar.gz -C .
          test -f app/src/main/java/hr/takto/app/ui/screens/CalendarScreen.kt
          test -f app/src/main/java/hr/takto/app/ui/screens/PatternsScreen.kt
          test -f app/src/main/java/hr/takto/app/ui/screens/SettingsScreen.kt
          test -f app/src/main/java/hr/takto/app/ui/screens/StatsScreen.kt
          test -f app/src/test/java/hr/takto/app/model/ScheduleLogicTest.kt
          test -f docs/UI_SPEC.md
          test -f samples/raspored-primjer.csv

      - name: Remove one-time bootstrap payload
        run: |
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: import remaining Takto 0.1.0 source"
          git push origin HEAD:feat/0.1.0-initial-app
