name: Bootstrap Takto source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ hashFiles('bootstrap/source.part*') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source tree
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source.part* | base64 --decode | tar -xzf -
          rm -rf bootstrap

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
          else
            git commit -m "Bootstrap Takto 0.1.0 source"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Android lint
        run: gradle --no-daemon --stacktrace lintDebug

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: takto-0.1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: takto-0.1.0-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
