name: Release Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Verify
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug lintRelease

      - name: Build APK and AAB
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Takto-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "release-assets/Takto-${VERSION}-release-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/Takto-${VERSION}-release-unsigned.aab"
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          test -s "release-assets/Takto-${VERSION}.apk"
          test -s "release-assets/Takto-${VERSION}-release-unsigned.apk"
          test -s "release-assets/Takto-${VERSION}-release-unsigned.aab"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Takto ${VERSION}" \
            --notes-file docs/RELEASE_0.1.0.md \
            release-assets/*
