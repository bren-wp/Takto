name: Release Android

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version and release state
        id: release_meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          APP_VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Neispravan versionName: $APP_VERSION" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$VERSION" != "$APP_VERSION" ]]; then
              echo "Tag $GITHUB_REF_NAME ne odgovara versionName=$APP_VERSION" >&2
              exit 1
            fi
          else
            VERSION="$APP_VERSION"
          fi

          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Izdanje $TAG već postoji; nema dupliciranja."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Gradle wrapper
        if: steps.release_meta.outputs.skip != 'true'
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17
        if: steps.release_meta.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37.1
        if: steps.release_meta.outputs.skip != 'true'
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Set up Gradle cache
        if: steps.release_meta.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Dead-code audit
        if: steps.release_meta.outputs.skip != 'true'
        run: python3 scripts/dead_code_audit.py --strict

      - name: Verify
        if: steps.release_meta.outputs.skip != 'true'
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug lintRelease

      - name: Build APK and AAB
        if: steps.release_meta.outputs.skip != 'true'
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease bundleRelease

      - name: Prepare release assets
        if: steps.release_meta.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/Takto-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "release-assets/Takto-${VERSION}-release-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-assets/Takto-${VERSION}-release-unsigned.aab"
          sha256sum release-assets/* > release-assets/SHA256SUMS.txt
          test -s "release-assets/Takto-${VERSION}.apk"
          test -s "release-assets/Takto-${VERSION}-release-unsigned.apk"
          test -s "release-assets/Takto-${VERSION}-release-unsigned.aab"
          test -s release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.release_meta.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          NOTES_FILE="docs/RELEASE_${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            gh release create "$TAG"               --target "$GITHUB_SHA"               --title "Takto ${VERSION}"               --notes-file "$NOTES_FILE"               release-assets/*
          else
            gh release create "$TAG"               --target "$GITHUB_SHA"               --title "Takto ${VERSION}"               --generate-notes               release-assets/*
          fi
